name: Local Monorepo Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'static-html-directory/**'
      - 'web/**'

jobs:
  local-deployment:
    runs-on: self-hosted

    steps:
      - name: Checkout Repo with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Local Web Stack (Nginx)
        shell: powershell # 👈 Forces native Windows PowerShell execution
        run: |
          Write-Host "Scanning for changes in 'web/' directory..."
          $CHANGED_FILES = git diff --name-only HEAD~1 HEAD
        
          if ($CHANGED_FILES -match "^web/") {
              Write-Host "🚀 Changes found! Re-deploying local Web Stack..."
              cd web
              docker compose down
              docker compose up -d --build
          } else {
              Write-Host "⏭️ No changes in 'web/'. Keeping current local Web container running."
          }

      - name: Local DB Stack (Postgres + Adminer)
        shell: powershell # 👈 Forces native Windows PowerShell execution
        run: |
          Write-Host "Scanning for changes in 'static-html-directory/' directory..."
          $CHANGED_FILES = git diff --name-only HEAD~1 HEAD
        
          if ($CHANGED_FILES -match "^static-html-directory/") {
              Write-Host "🚀 Changes found! Re-deploying local Database Stack..."
              cd static-html-directory
              docker compose down
              docker compose up -d --build
          } else {
              Write-Host "⏭️ No changes in 'db/'. Keeping current local DB container running."
          }
